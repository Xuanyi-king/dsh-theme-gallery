feature_name: Nine themed startup intros
core_value: Give every saved gallery theme a distinct, polished image-and-code opening.
summary: >-
  The user accepted the Shanhe sample and approved all nine remaining designs.
  Use existing artwork, scene-specific vector effects, readable typography, and a four-second startup-only opening.
in_scope:
  - story_id: e02s01
    requirement: Add dedicated light, emperor, flame, staff, lotus, tide, rain, sunrise, and nimbus designs.
  - story_id: e02s01
    requirement: Preserve Shanhe visuals and the shared restore, cancellation, focus, and reduced-motion behavior.
  - story_id: e02s01
    requirement: Provide a local offline theme chooser with replay and desktop/mobile screenshots.
  - story_id: e02s01
    requirement: Update the linked Chinese-first and English guides.
out_of_scope:
  - item: Video generation or audio
    reason: User selected image-and-code openings.
  - item: New-conversation or theme-switch autoplay in DSH
    reason: Startup-only behavior remains approved.
  - item: Changes to standalone theme packages or native chat controls
    reason: Work applies to the unified gallery overlay only.
  - item: GitHub push, merge, registry publishing, and version release
    reason: Await visual approval for this new batch.
constraints:
  - No new runtime dependencies, remote assets, or duplicated wallpaper bytes.
  - Effects must be bounded, subtle, and readable at desktop and mobile sizes.
success_criteria:
  - Each valid saved gallery theme plays its corresponding intro once.
  - Each of the nine new themes has distinct artwork and matching copy.
  - Built-in choices and reduced-motion mode show no intro.
  - Existing Shanhe visuals and cancellation behavior remain intact.
  - Full tests, offline bundle checks, and desktop/mobile browser verification pass.
references:
  - specs/epics/e02-themed-intros/e02s01-themed-intros.md
